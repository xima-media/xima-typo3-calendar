routeEnhancers:
  CalendarEventDetailPlugin:
    type: Extbase
    extension: XimaTypo3Calendar
    plugin: EventDetail
    routes:
      # `event_path` resolves to `<uid>-<slug>` and is listed before the bare `event_uid`
      # variants, so a generated URL carries the slug whenever the event has one and falls
      # back to the slug-less shape when it does not.
      #
      # The `.ics` variants come first: `event_path` matches anything but a slash, so the
      # plain routes below would happily swallow the extension into the slug.
      - routePath: '/{event_path}/a{appointment_uid}.ics'
        _controller: 'Event::ics'
        _arguments:
          event_path: 'event'
          appointment_uid: 'appointment'
      - routePath: '/{event_uid}/a{appointment_uid}.ics'
        _controller: 'Event::ics'
        _arguments:
          event_uid: 'event'
          appointment_uid: 'appointment'
      - routePath: '/a{appointment_uid}.ics'
        _controller: 'Event::ics'
        _arguments:
          appointment_uid: 'appointment'
      - routePath: '/{event_path}.ics'
        _controller: 'Event::ics'
        _arguments:
          event_path: 'event'
      - routePath: '/{event_uid}.ics'
        _controller: 'Event::ics'
        _arguments:
          event_uid: 'event'
      - routePath: '/a{appointment_uid}'
        _controller: 'Event::show'
        _arguments:
          appointment_uid: 'appointment'
      - routePath: '/{event_path}/a{appointment_uid}'
        _controller: 'Event::show'
        _arguments:
          event_path: 'event'
          appointment_uid: 'appointment'
      - routePath: '/{event_uid}/a{appointment_uid}'
        _controller: 'Event::show'
        _arguments:
          event_uid: 'event'
          appointment_uid: 'appointment'
      - routePath: '/{event_path}'
        _controller: 'Event::show'
        _arguments:
          event_path: 'event'
      - routePath: '/{event_uid}'
        _controller: 'Event::show'
        _arguments:
          event_uid: 'event'
    defaultController: 'Event::show'
    aspects:
      event_path:
        type: XimaTypo3CalendarEventPathMapper
        tableName: tx_ximatypo3calendar_domain_model_event
        routeFieldPattern: '^(?P<uid>\d+)-(?P<slug>.+)$'
        routeFieldResult: '{uid}-{slug}'
      event_uid:
        type: PersistedAliasMapper
        tableName: tx_ximatypo3calendar_domain_model_event
        routeFieldName: uid
      appointment_uid:
        type: PersistedAliasMapper
        tableName: tx_ximatypo3calendar_domain_model_entry
        routeFieldName: uid
