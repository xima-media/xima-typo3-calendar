<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:layout name="SystemEmail" />

    <f:section name="Subject">Event live: #{eventUid}</f:section>

    <f:section name="Title">Event live</f:section>

    <f:section name="Main">
        <p>Your event is now live.</p>
        <p>
            Event UID:
            <strong>{eventUid}</strong>
            <br />
            <f:if condition="{eventTitle}">
                Event title:
                <strong>{eventTitle}</strong>
            </f:if>
        </p>
        <p>
            <a href="{eventEditUrl}">Open event in backend</a>
        </p>
    </f:section>
</html>
