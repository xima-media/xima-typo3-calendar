<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:layout name="SystemEmail" />

    <f:section name="Subject">{subjectLabel}: #{eventUid}</f:section>

    <f:section name="Title">{titleLabel}</f:section>

    <f:section name="Main">
        <f:if condition="{statusMessage}">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin: 0 0 24px; border-collapse: collapse;">
                <tr>
                    <td style="padding: 16px 20px; background-color: #eef2f7; border-left: 4px solid #2f6fed; border-radius: 4px; font-size: 15px; line-height: 1.6; color: #1a1a1a;">
                        <strong style="display: block; margin-bottom: 6px; color: #2f6fed; text-transform: uppercase; letter-spacing: .04em; font-size: 12px;">{statusMessageLabel}</strong>
                        <f:format.nl2br>{statusMessage}</f:format.nl2br>
                    </td>
                </tr>
            </table>
        </f:if>
        <p>{introLabel}</p>
        <p>
            {eventUidLabel}:
            <strong>{eventUid}</strong>
            <br />
            <f:if condition="{eventTitle}">
                {eventTitleLabel}:
                <strong>{eventTitle}</strong>
            </f:if>
        </p>
        <f:if condition="{changedByBeUser.name}">
            <p>{changedByLabel}: <strong>{changedByBeUser.name}</strong></p>
        </f:if>
        <f:if condition="{eventEditUrl}">
            <p><a href="{eventEditUrl}">{openBackendLabel}</a></p>
        </f:if>
    </f:section>
</html>
