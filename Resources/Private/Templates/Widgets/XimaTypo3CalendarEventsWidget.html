<html
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:layout name="Widget/Widget" />

    <f:section name="main">
        <f:if condition="!{items}">
            <f:then>
                <f:translate key="LLL:EXT:xima_typo3_calendar/Resources/Private/Language/locallang.xlf:widget.no_entries" />
            </f:then>
            <f:else>
                <div class="widget-table-wrapper">
                    <table class="widget-table table-striped table-hover table">
                        <tr>
                            <th>Titel</th>
                            <th>Nächster Termin</th>
                            <th></th>
                        </tr>
                        <f:for each="{items}" as="item">
                            <tr>
                                <td>
                                    <strong>{item.title}</strong>
                                </td>
                                <td>{item.start_date -> f:format.date(format: 'd.m.Y H:i')}</td>
                                <td class="text-end">
                                    <div class="btn-group">
                                        <be:link.editRecord
                                            uid="{item.uid}"
                                            table="tx_ximatypo3calendar_domain_model_event"
                                            returnUrl="{be:moduleLink(route: 'dashboard')}"
                                            class="btn btn-default">
                                            <core:icon identifier="actions-open" alternativeMarkupIdentifier="inline" />
                                        </be:link.editRecord>
                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </table>
                </div>
            </f:else>
        </f:if>
    </f:section>

    <f:section name="footer">
        <f:render partial="Widget/Button" arguments="{button: button}" />
    </f:section>
</html>
