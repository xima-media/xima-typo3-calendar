<?xml version="1.0" encoding="UTF-8"?>
<svg width="32px" height="32px" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4285F4"/>
            <stop offset="100%" stop-color="#0F62FE"/>
        </linearGradient>
    </defs>
    <!-- Background -->
    <rect x="0" y="0" width="32" height="32" rx="2" fill="url(#bg)"/>

    <!-- Calendar body -->
    <rect x="6" y="8" width="20" height="18" rx="1.5" fill="#FFF"/>

    <!-- Calendar header -->
    <rect x="6" y="8" width="20" height="5" rx="1.5" fill="#FFF" opacity="0.95"/>
    <rect x="6" y="8" width="20" height="5" fill="#0F62FE" opacity="0.15"/>

    <!-- Binding rings -->
    <rect x="10" y="6" width="2" height="4" rx="1" fill="#FFF"/>
    <rect x="20" y="6" width="2" height="4" rx="1" fill="#FFF"/>

    <!-- Calendar grid - Week 1 -->
    <circle cx="9.5" cy="16" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="13" cy="16" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="16.5" cy="16" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="20" cy="16" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="23.5" cy="16" r="1" fill="#0F62FE" opacity="0.3"/>

    <!-- Calendar grid - Week 2 -->
    <circle cx="9.5" cy="19.5" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="13" cy="19.5" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="16.5" cy="19.5" r="1.2" fill="#0F62FE"/>
    <circle cx="20" cy="19.5" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="23.5" cy="19.5" r="1" fill="#0F62FE" opacity="0.3"/>

    <!-- Calendar grid - Week 3 -->
    <circle cx="9.5" cy="23" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="13" cy="23" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="16.5" cy="23" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="20" cy="23" r="1" fill="#0F62FE" opacity="0.3"/>
    <circle cx="23.5" cy="23" r="1" fill="#0F62FE" opacity="0.3"/>
</svg>